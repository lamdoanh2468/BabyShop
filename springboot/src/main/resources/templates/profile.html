<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="pf-page">
    <nav class="pf-breadcrumb">
        <a th:href="@{/}">Trang chủ</a>
        <span class="dot">•</span>
        <span>Thông tin cá nhân</span>
    </nav>

    <div class="pf-container">
        <div th:replace="~{fragments/profileSidebar :: sidebar('profile')}"></div>

        <main class="pf-content">
            <section class="pf-section pf-section-active">
                <h3><i class="fas fa-id-card"></i> Thông tin cá nhân</h3>

                <div class="pf-info-box">
                    <div class="pf-info">
                        <div class="pf-avatar">
                            <img th:src="${profile != null and profile.avatarUrl != null} ? ${profile.avatarUrl}
                                       : 'https://ui-avatars.com/api/?name=User&background=6366f1&color=fff&size=200'"
                                 alt="Avatar"
                                 onerror="this.src='https://ui-avatars.com/api/?name=User&background=6366f1&color=fff&size=200'">
                            <label for="pf-avatar-upload" class="pf-upload-btn">
                                <i class="fas fa-camera"></i> Tải ảnh lên
                            </label>
                            <input type="file" id="pf-avatar-upload" accept="image/*" hidden>
                        </div>

                        <form class="pf-form" method="post" th:action="@{/profile}">
                            <div class="pf-form-group">
                                <label><i class="fas fa-user"></i> Họ và tên</label>
                                <input type="text" name="fullName" th:value="${profile != null ? profile.fullName : ''}"
                                       placeholder="Nhập họ và tên">
                            </div>

                            <div class="pf-form-group">
                                <label><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" th:value="${profile != null ? profile.email : ''}" disabled
                                       placeholder="Email không thể thay đổi">
                            </div>

                            <div class="pf-form-group">
                                <label><i class="fas fa-phone"></i> Số điện thoại</label>
                                <input type="text" name="phone" th:value="${profile != null ? profile.phone : ''}"
                                       placeholder="Nhập số điện thoại">
                            </div>

                            <div class="pf-form-group">
                                <label><i class="fas fa-map-marker-alt"></i> Địa chỉ</label>
                                <input type="text" name="address" th:value="${profile != null ? profile.address : ''}"
                                       placeholder="Nhập địa chỉ">
                            </div>

                            <div class="pf-form-group">
                                <label><i class="fas fa-venus-mars"></i> Giới tính</label>
                                <select name="gender">
                                    <option value="Male" th:selected="${profile != null and profile.gender == 'Male'}">Nam</option>
                                    <option value="Female" th:selected="${profile != null and profile.gender == 'Female'}">Nữ</option>
                                </select>
                            </div>

                            <div class="pf-form-group">
                                <label><i class="fas fa-calendar-alt"></i> Ngày sinh</label>
                                <input type="date" name="birthDate"
                                       th:value="${profile != null and profile.birthDate != null} ? ${#dates.format(profile.birthDate, 'yyyy-MM-dd')} : ''">
                            </div>

                            <div class="pf-form-group full-width" style="margin-top: 10px;">
                                <button id="pf-save-btn" type="submit">
                                    <i class="fas fa-save"></i> Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/profile.js}"></script>
</body>
</html>
