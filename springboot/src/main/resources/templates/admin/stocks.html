<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - Quản lý kho</title>
    <link rel="stylesheet" th:href="@{/css/admin_style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <style>
        .btn-add { display:inline-flex; align-items:center; gap:8px; padding:12px 20px;
            background:linear-gradient(135deg,#6C63FF,#A696FF); color:#fff; font-weight:600;
            font-size:14px; border-radius:12px; text-decoration:none; }
    </style>
</head>
<body>
<div class="dashboard">
    <div th:replace="~{fragments/adminSidebar :: sidebar('stocks')}"></div>

    <main class="main">
        <h2>Quản lý kho hàng</h2>
        <a th:href="@{/admin/stocks(action='add')}" class="btn-add"
           style="margin-bottom:20px;display:inline-block"><i class="fa-solid fa-plus"></i> Thêm kho</a>

        <table class="data-table">
            <thead>
            <tr><th>ID</th><th>Tên kho</th><th>Địa chỉ</th><th>Thao tác</th></tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(stocks)}">
                <td colspan="4" style="text-align:center;padding:20px;">Không có kho</td>
            </tr>
            <tr th:each="s : ${stocks}">
                <td th:text="'#' + ${s.stockId}">#0</td>
                <td><strong th:text="${s.stockName}">Tên kho</strong></td>
                <td th:text="${s.stockAddress}">Địa chỉ</td>
                <td>
                    <a class="btn-small btn-on" th:href="@{/admin/stocks(action='edit', id=${s.stockId})}">
                        <i class="fa-solid fa-pen"></i></a>
                    <form method="post" th:action="@{/admin/stocks}" style="display:inline"
                          onsubmit="return confirm('Xóa kho này?')">
                        <input type="hidden" name="action" value="delete"/>
                        <input type="hidden" name="id" th:value="${s.stockId}"/>
                        <button type="submit" class="btn-small btn-delete"><i class="fa-solid fa-trash"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
