<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - Đơn hàng</title>
    <link rel="stylesheet" th:href="@{/css/admin_style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>
<div class="dashboard">
    <div th:replace="~{fragments/adminSidebar :: sidebar('orders')}"></div>

    <main class="main">
        <h2>Quản lý đơn hàng</h2>
        <table class="data-table">
            <thead>
            <tr><th>Mã đơn</th><th>Khách hàng</th><th>Tổng tiền</th><th>Thanh toán</th><th>Ngày</th><th>Trạng thái</th><th>Thao tác</th></tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="7" style="text-align:center;padding:20px;">Chưa có đơn hàng</td>
            </tr>
            <tr th:each="o : ${orders}">
                <td th:text="'#' + ${o.orderId}">#0</td>
                <td th:text="${o.username}">user</td>
                <td><span th:text="${#numbers.formatInteger(o.totalAmount, 0, 'POINT')}">0</span>đ</td>
                <td th:text="${o.paymentMethod}">COD</td>
                <td th:text="${o.orderDate != null ? #dates.format(o.orderDate, 'dd/MM/yyyy') : ''}">01/01/2025</td>
                <td><span class="status" th:text="${o.status}">Done</span></td>
                <td>
                    <a class="btn-small btn-on" th:href="@{/admin/orders/detail(id=${o.orderId})}">
                        <i class="fa-solid fa-eye"></i> Xem</a>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
