<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="pf-page">
    <nav class="pf-breadcrumb">
        <a th:href="@{/}">Trang chủ</a>
        <span class="dot">•</span>
        <span>Đổi mật khẩu</span>
    </nav>

    <div class="pf-container">
        <div th:replace="~{fragments/profileSidebar :: sidebar('password')}"></div>

        <main class="pf-content">
            <section class="pf-section pf-section-active">
                <h3><i class="fas fa-shield-alt"></i> Đổi mật khẩu</h3>

                <div class="pf-password-box">
                    <div class="pf-message error" th:if="${error != null}">
                        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                    </div>
                    <div class="pf-message success" th:if="${success != null}">
                        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                    </div>

                    <form class="pf-password-form" method="post" th:action="@{/change-password}">
                        <div class="pf-form-group">
                            <label><i class="fas fa-lock"></i> Mật khẩu hiện tại</label>
                            <div class="password-input-wrapper">
                                <input type="password" name="oldPassword" id="oldPassword" placeholder="Nhập mật khẩu hiện tại" required>
                                <button type="button" class="password-toggle" onclick="togglePassword('oldPassword', this)"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <div class="pf-form-group">
                            <label><i class="fas fa-key"></i> Mật khẩu mới</label>
                            <div class="password-input-wrapper">
                                <input type="password" name="newPassword" id="newPassword" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" required>
                                <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <div class="pf-form-group">
                            <label><i class="fas fa-check-double"></i> Xác nhận mật khẩu mới</label>
                            <div class="password-input-wrapper">
                                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" required>
                                <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <button id="pf-change-pass-btn" type="submit"><i class="fas fa-sync-alt"></i> Đổi mật khẩu</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('i');
        if (input.type === 'password') { input.type = 'text'; icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
        else { input.type = 'password'; icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
    }
</script>
</body>
</html>
