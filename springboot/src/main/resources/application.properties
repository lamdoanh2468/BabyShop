# ==== Datasource: dùng đúng biến môi trường như bản JSP (DB_HOST/DB_PORT/...) ====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_babyshop}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ==== JPA/Hibernate: KHÔNG cho sửa schema thật ====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==== Thymeleaf: tắt cache khi dev ====
spring.thymeleaf.cache=false

# ==== Mail (OTP): đặt MAIL_USERNAME/MAIL_PASSWORD (app password Gmail) để gửi thật.
#      Nếu để trống, EmailService chỉ log OTP ra console (dev/test), không gửi. ====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8080
